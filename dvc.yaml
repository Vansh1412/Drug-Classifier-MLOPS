# =============================================================================
# MedMLOps-X — DVC Reproducible Training Pipeline
# =============================================================================
stages:
  validate:
    cmd: python -c "from src.config import load_config; from src.data_validation import load_and_validate; load_and_validate('Data/drug.csv', load_config())"
    deps:
      - Data/drug.csv
      - configs/model_config.yaml
      - src/data_validation.py

  train:
    cmd: python train.py
    deps:
      - Data/drug.csv
      - configs/model_config.yaml
      - src
      - train.py
    outs:
      - Model/drug_pipeline.skops:
          cache: false
      - Model/model_metadata.json:
          cache: false
      - Results/metrics.json:
          cache: false
      - Results/metrics.txt:
          cache: false
      - Results/model_results.png:
          cache: false
      - Results/competition_report.json:
          cache: false

  validate_reviews:
    cmd: python -c "from src.nlp_validation import validate_review_dataset; validate_review_dataset('Data/reviews/drugsComTest_raw.csv')"
    deps:
      - Data/reviews/drugsComTest_raw.csv
      - configs/model_config.yaml
      - src/nlp_validation.py

  preprocess_reviews:
    cmd: python -c "from src.nlp_preprocessing import run_review_preprocessing; run_review_preprocessing('Data/reviews/drugsComTest_raw.csv')"
    deps:
      - Data/reviews/drugsComTest_raw.csv
      - configs/model_config.yaml
      - src/nlp_preprocessing.py
    outs:
      - Data/reviews/processed/reviews_cleaned.parquet:
          cache: false

  nlp_competition:
    cmd: python -c "from src.nlp_competition import run_nlp_competition; run_nlp_competition()"
    deps:
      - Data/reviews/processed/reviews_cleaned.parquet
      - configs/model_config.yaml
      - src/nlp_competition.py
      - src/nlp_tracking.py
    outs:
      - Results/nlp_competition_report.json:
          cache: false
      - Results/nlp_metrics.json:
          cache: false

  patient_experience_analysis:
    cmd: python -c "from src.patient_experience import generate_patient_experience_report; generate_patient_experience_report()"
    deps:
      - Data/reviews/processed/reviews_cleaned.parquet
      - configs/model_config.yaml
      - src/patient_experience.py
    outs:
      - Results/patient_experience_report.json:
          cache: false
      - Results/patient_experience_summary.json:
          cache: false

  nlp_monitoring:
    cmd: python -c "from src.nlp_monitoring import run_nlp_monitoring; run_nlp_monitoring()"
    deps:
      - Data/reviews/processed/reviews_cleaned.parquet
      - configs/model_config.yaml
      - src/nlp_monitoring.py
    outs:
      - Results/nlp_drift_report.json:
          cache: false
