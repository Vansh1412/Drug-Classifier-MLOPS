name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Format Check (Black)
        run: black --check .

      - name: Lint Check (Ruff)
        run: ruff check .

      - name: Generate Derived NLP Review Parquet
        run: |
          python -c "from src.nlp_preprocessing import run_review_preprocessing; run_review_preprocessing('Data/reviews/drugsComTest_raw.csv')"

      - name: Verify DVC Pipeline Status
        run: dvc status

      - name: Run Test Suite
        env:
          MEDMLOPS_ADMIN_API_KEY: "medmlops-admin-key-sprint6"
          MLFLOW_TRACKING_URI: "sqlite:///mlruns.db"
        run: pytest -v

      - name: Build Hardened Docker Image
        run: docker build -t medmlops-x:local .

      - name: Container Smoke & Security Test
        run: |
          echo "Starting MedMLOps-X production container..."
          docker run -d --name medmlops-container -p 8000:8000 medmlops-x:local

          echo "Waiting for container health check..."
          HEALTHY=0
          for i in $(seq 1 30); do
            if curl -s -f http://localhost:8000/health > /dev/null; then
              echo "Container reached healthy state in $i seconds"
              HEALTHY=1
              break
            fi
            sleep 1
          done

          if [ $HEALTHY -eq 0 ]; then
            echo "ERROR: Container failed to reach healthy state within 30 seconds!"
            docker logs medmlops-container
            exit 1
          fi

          echo "=== 1. Health Endpoint Smoke Test ==="
          HEALTH_RESP=$(curl -s -f http://localhost:8000/health)
          echo "Health: $HEALTH_RESP"
          echo "$HEALTH_RESP" | grep -q '"status":"healthy"'

          echo "=== 2. Predict Endpoint Smoke Test ==="
          PRED_RESP=$(curl -s -f -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"age": 30, "sex": "M", "blood_pressure": "HIGH", "cholesterol": "NORMAL", "na_to_k_ratio": 15.4}')
          echo "Predict: $PRED_RESP"
          echo "$PRED_RESP" | grep -q '"predicted_drug"'

          echo "=== 3. Explain Endpoint Smoke Test ==="
          EXPLAIN_RESP=$(curl -s -f -X POST http://localhost:8000/explain \
            -H "Content-Type: application/json" \
            -d '{"age": 30, "sex": "M", "blood_pressure": "HIGH", "cholesterol": "NORMAL", "na_to_k_ratio": 15.4}')
          echo "Explain: $EXPLAIN_RESP"
          echo "$EXPLAIN_RESP" | grep -q '"feature_attributions"'

          echo "=== 4. Version Endpoint Smoke Test ==="
          VER_RESP=$(curl -s -f http://localhost:8000/version)
          echo "Version: $VER_RESP"
          echo "$VER_RESP" | grep -q '"model_name"'

          echo "=== 5. Metrics Endpoint Smoke Test ==="
          METRICS_RESP=$(curl -s -f http://localhost:8000/metrics)
          echo "Metrics: $METRICS_RESP"
          echo "$METRICS_RESP" | grep -q '"total_requests"'

          echo "=== 6. Monitoring Endpoint Smoke Test ==="
          MON_RESP=$(curl -s -f http://localhost:8000/monitoring/latest)
          echo "Monitoring: $MON_RESP"
          echo "$MON_RESP" | grep -q '"report_id"'

          echo "=== 7. Model Champion Registry Smoke Test ==="
          CHAMP_RESP=$(curl -s -f http://localhost:8000/models/champion)
          echo "Champion: $CHAMP_RESP"
          echo "$CHAMP_RESP" | grep -q '"active_champion"'

          echo "=== 8. Security: Non-Root User Verification ==="
          CONTAINER_USER=$(docker exec medmlops-container whoami)
          echo "Runtime Container User: $CONTAINER_USER"
          if [ "$CONTAINER_USER" = "root" ]; then
            echo "ERROR: Container is executing as root!"
            exit 1
          fi

          echo "=== 9. Container Cleanup ==="
          docker logs medmlops-container
          docker stop medmlops-container
          docker rm medmlops-container

      - name: Setup CML
        run: npm install -g @dvcorg/cml

      - name: Create Evaluation Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Model Metrics & CI Status" > report.md
          if [ -f "./Results/metrics.txt" ]; then
            cat ./Results/metrics.txt >> report.md
          fi
          echo "" >> report.md
          echo "## Confusion Matrix" >> report.md
          if [ -f "./Results/model_results.png" ]; then
            echo "![Confusion Matrix](./Results/model_results.png)" >> report.md
          fi
          
          # Render directly on GitHub Actions Job Summary tab
          cat report.md >> $GITHUB_STEP_SUMMARY
          
          # Post comment via CML (with fallback)
          cml comment create report.md || true