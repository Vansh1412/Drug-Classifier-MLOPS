name: Continuous Deployment
on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Hugging Face Hub
        run: pip install --upgrade "huggingface_hub>=0.20.0"

      - name: Deploy to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::notice::Hugging Face secrets (HF / HF_SPACE) not configured. Skipping deployment step gracefully."
            exit 0
          fi

          python - << 'EOF'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          space_id = os.environ["HF_SPACE"]

          api = HfApi(token=token)
          print(f"Deploying to Hugging Face Space: {space_id}...")

          api.upload_folder(
              folder_path="./App",
              repo_id=space_id,
              repo_type="space",
              commit_message="Sync App files"
          )
          api.upload_folder(
              folder_path="./Model",
              path_in_repo="Model",
              repo_id=space_id,
              repo_type="space",
              commit_message="Sync Model"
          )
          api.upload_folder(
              folder_path="./Results",
              path_in_repo="Metrics",
              repo_id=space_id,
              repo_type="space",
              commit_message="Sync Metrics"
          )
          print("Successfully deployed to Hugging Face Spaces!")
          EOF