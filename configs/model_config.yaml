# =============================================================================
# MedMLOps-X — Centralized Configuration
# =============================================================================

project:
  name: "medmlops-x"
  version: "0.2.0"
  description: "Production Drug Classifier MLOps Platform"

# ---------------------------------------------------------------------------
# Data Configuration
# ---------------------------------------------------------------------------
data:
  data_path: "Data/drug.csv"
  target_column: "Drug"
  columns:
    - "Age"
    - "Sex"
    - "BP"
    - "Cholesterol"
    - "Na_to_K"
    - "Drug"
  categorical_features:
    - "Sex"
    - "BP"
    - "Cholesterol"
  categorical_indices: [1, 2, 3]
  numerical_features:
    - "Age"
    - "Na_to_K"
  numerical_indices: [0, 4]
  test_size: 0.3
  shuffle_random_state: 125   # Seed for dataset shuffling (drug_df.sample)
  split_random_state: 125     # Seed for train_test_split
  cv_random_state: 125        # Seed for StratifiedKFold cross-validation
  cv_folds: 5

# ---------------------------------------------------------------------------
# Validation Constraints
# ---------------------------------------------------------------------------
validation:
  age_min: 15
  age_max: 74
  na_to_k_min: 6.0
  na_to_k_max: 39.0
  sex_categories:
    - "F"
    - "M"
  bp_categories:
    - "HIGH"
    - "LOW"
    - "NORMAL"
  cholesterol_categories:
    - "HIGH"
    - "NORMAL"
  valid_drug_classes:
    - "DrugY"
    - "drugA"
    - "drugB"
    - "drugC"
    - "drugX"

# ---------------------------------------------------------------------------
# Model Competition Candidates
# ---------------------------------------------------------------------------
models:
  logistic_regression:
    class: "LogisticRegression"
    params:
      max_iter: 2000
      random_state: 125
      solver: "lbfgs"

  random_forest:
    class: "RandomForestClassifier"
    params:
      n_estimators: 100
      random_state: 125
      n_jobs: 1      # n_jobs=1 ensures deterministic output on same platform

  extra_trees:
    class: "ExtraTreesClassifier"
    params:
      n_estimators: 100
      random_state: 125
      n_jobs: 1

  xgboost:
    class: "XGBClassifier"
    params:
      n_estimators: 100
      seed: 125
      nthread: 1
      eval_metric: "mlogloss"
      verbosity: 0
      # XGBoost requires integer-encoded labels; handled by LabelEncoder in train.py

# ---------------------------------------------------------------------------
# Champion Selection Policy
# ---------------------------------------------------------------------------
champion:
  primary_metric: "macro_f1"          # Metric used to rank candidates
  min_accuracy: 0.80
  min_macro_f1: 0.75
  min_recall: 0.70
  artifact_path: "Model/drug_pipeline.skops"
  metadata_path: "Model/model_metadata.json"

# ---------------------------------------------------------------------------
# Security — Skops Trusted Types Whitelist
# ---------------------------------------------------------------------------
security:
  trusted_types:
    - "sklearn.pipeline.Pipeline"
    - "sklearn.preprocessing.OneHotEncoder"
    - "sklearn.preprocessing.StandardScaler"
    - "sklearn.compose.ColumnTransformer"
    - "sklearn.preprocessing.OrdinalEncoder"
    - "sklearn.impute.SimpleImputer"
    - "sklearn.tree.DecisionTreeClassifier"
    - "sklearn.tree._classes.DecisionTreeClassifier"
    - "sklearn.ensemble.RandomForestClassifier"
    - "sklearn.ensemble._forest.RandomForestClassifier"
    - "sklearn.ensemble.ExtraTreesClassifier"
    - "sklearn.ensemble._forest.ExtraTreesClassifier"
    - "sklearn.tree.ExtraTreeClassifier"
    - "sklearn.tree._classes.ExtraTreeClassifier"
    - "sklearn.linear_model.LogisticRegression"
    - "sklearn.linear_model._logistic.LogisticRegression"
    - "src.model_registry.XGBStringClassifier"
    - "xgboost.sklearn.XGBClassifier"
    - "xgboost.core.Booster"
    - "sklearn.preprocessing.LabelEncoder"
    - "sklearn.preprocessing._label.LabelEncoder"
    - "numpy.ndarray"
    - "numpy.dtype"

# ---------------------------------------------------------------------------
# Results Paths
# ---------------------------------------------------------------------------
results:
  metrics_txt: "Results/metrics.txt"
  metrics_json: "Results/metrics.json"
  confusion_matrix_png: "Results/model_results.png"
  competition_report_json: "Results/competition_report.json"

# ---------------------------------------------------------------------------
# MLflow Experiment Tracking
# ---------------------------------------------------------------------------
mlflow:
  enabled: true
  experiment_name: "MedMLOps-X-Drug-Classifier"
  tracking_uri: "sqlite:///mlruns.db"
  artifact_location: "mlartifacts"
  log_models: true

# ---------------------------------------------------------------------------
# Explainability Configuration
# ---------------------------------------------------------------------------
explainability:
  enabled: true
  method: "SHAP"
  max_features: 5

# ---------------------------------------------------------------------------
# API Configuration
# ---------------------------------------------------------------------------
api:
  version: "1.1.0"
  metrics_enabled: true

# ---------------------------------------------------------------------------
# Continuous Monitoring & Drift Detection Configuration
# ---------------------------------------------------------------------------
monitoring:
  enabled: true
  reference_dataset: "Data/drug.csv"
  reports_dir: "monitoring/reports"
  max_batch_size: 1000
  thresholds:
    numerical:
      method: "ks"
      p_value_warning: 0.05
      p_value_drift: 0.01
      wasserstein_warning: 0.15
    categorical:
      method: "psi"
      psi_warning: 0.10
      psi_drift: 0.20
      chi2_p_value_drift: 0.05
    prediction:
      class_psi_warning: 0.10
      class_psi_drift: 0.20
      confidence_ks_warning: 0.05
      confidence_ks_drift: 0.01
    quality:
      max_null_rate: 0.0
      max_out_of_range_rate: 0.0

# ---------------------------------------------------------------------------
# Automated Retraining & Model Promotion Configuration (Sprint 6)
# ---------------------------------------------------------------------------
retraining:
  enabled: true
  min_monitoring_samples: 20
  challengers_dir: "Model/challengers"
  archive_dir: "Model/archive"
  manifest_path: "Model/registry_manifest.json"
  trigger_history_path: "monitoring/retraining_history.json"
  quality_gate:
    max_allowed_f1_drop: 0.02
    max_allowed_cv_f1_drop: 0.03
    min_accuracy: 0.80
    min_macro_f1: 0.75
    min_recall: 0.70
  security:
    api_key_header: "X-API-Key"
    admin_api_key_env: "MEDMLOPS_ADMIN_API_KEY"
    default_admin_key: "medmlops-admin-key-sprint6"

# ---------------------------------------------------------------------------
# NLP / Drug Review Intelligence Configuration (Sprint 7)
# ---------------------------------------------------------------------------
reviews:
  raw_data_path: "Data/reviews/drugsComTest_raw.csv"
  processed_data_path: "Data/reviews/processed/reviews_cleaned.parquet"
  processed_dir: "Data/reviews/processed"
  columns:
    - "uniqueID"
    - "drugName"
    - "condition"
    - "review"
    - "rating"
    - "date"
    - "usefulCount"
  validation:
    rating_min: 1
    rating_max: 10
    useful_count_min: 0
    max_missing_condition_rate: 0.05
    allow_missing_conditions: true
    missing_condition_placeholder: "Unknown"
  splitting:
    default_strategy: "stratified_group"
    test_size: 0.2
    random_state: 125
    stratify_column: "rating"
    group_column: "review_clean_hash"
    temporal_threshold_date: "2017-01-01"
  nlp_competition:
    target:
      name: "sentiment_class"
      rating_col: "rating"
      bins:
        low: [1, 4]
        neutral: [5, 7]
        high: [8, 10]
      classes:
        - "low"
        - "neutral"
        - "high"
    tfidf:
      ngram_range: [1, 2]
      min_df: 3
      max_df: 0.90
      sublinear_tf: true
      max_features: 10000
    models:
      logistic_regression:
        C: 1.0
        max_iter: 1000
        solver: "lbfgs"
        class_weight: "balanced"
        random_state: 125
      linear_svm:
        C: 1.0
        max_iter: 2000
        class_weight: "balanced"
        random_state: 125
      naive_bayes:
        alpha: 0.5
    cv:
      folds: 5
      random_state: 125
      group_column: "review_clean_hash"
      stratify_column: "sentiment_class"
      primary_metric: "macro_f1"
    quality_gate:
      min_macro_f1: 0.70
      min_accuracy: 0.70
      min_class_recall: 0.40
    mlflow:
      experiment_name: "MedMLOps-X-NLP-Drug-Review"
      tracking_uri: "sqlite:///mlruns.db"
      artifact_location: "mlartifacts"
      log_models: true
    artifacts:
      champion_dir: "Model/nlp/champion"
      pipeline_path: "Model/nlp/champion/nlp_champion_pipeline.skops"
      metadata_path: "Model/nlp/nlp_model_metadata.json"
      report_path: "Results/nlp_competition_report.json"
      metrics_path: "Results/nlp_metrics.json"
  patient_experience:
    min_reviews_threshold: 20
    condition_min_reviews_threshold: 10
    aspects:
      side_effects:
        - "side effect"
        - "nausea"
        - "headache"
        - "dizziness"
        - "dizzy"
        - "vomiting"
        - "fatigue"
        - "rash"
        - "stomach pain"
        - "diarrhea"
      effectiveness:
        - "effective"
        - "cured"
        - "worked wonders"
        - "helped"
        - "works great"
        - "relief"
        - "miracle"
        - "improved"
        - "symptom free"
      dosage_administration:
        - "dose"
        - "dosage"
        - "pill"
        - "tablet"
        - "capsule"
        - "injection"
        - "daily"
        - "mg"
        - "twice a day"
      cost_affordability:
        - "cost"
        - "expensive"
        - "insurance"
        - "copay"
        - "affordable"
        - "cheap"
        - "price"
        - "coverage"
        - "pocket"
      sleep_drowsiness:
        - "insomnia"
        - "drowsy"
        - "drowsiness"
        - "sleep"
        - "sleeping"
        - "nightmare"
        - "somnolence"
        - "tired"
      mental_mood:
        - "anxiety"
        - "depression"
        - "panic"
        - "mood"
        - "suicidal"
        - "calm"
        - "irritability"
        - "depressed"
        - "nervous"
      weight_appetite:
        - "weight gain"
        - "weight loss"
        - "appetite"
        - "gained weight"
        - "lost weight"
        - "hungry"
        - "hunger"
        - "pounds"
      withdrawal_dependence:
        - "withdrawal"
        - "taper"
        - "dependence"
        - "depend"
        - "stopping"
        - "stopped taking"
        - "wean"
    similarity:
      ngram_range: [1, 2]
      min_df: 3
      max_df: 0.90
      max_features: 10000
      default_top_k: 5
    reports:
      full_report_path: "Results/patient_experience_report.json"
      summary_report_path: "Results/patient_experience_summary.json"

