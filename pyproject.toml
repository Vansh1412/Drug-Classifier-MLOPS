[project]
name = "medmlops-x"
version = "0.1.0"
description = "Explainable, Quality-Gated, Observable MLOps Platform for Drug Classification"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "MedMLOps-X Engineering Team" }
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::sklearn.exceptions.InconsistentVersionWarning",
]

[tool.black]
line-length = 88
target-version = ["py310"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.pytest_cache
  | __pycache__
  | build
  | dist
  | \.venv
)/
'''

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    "build",
    "dist",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.coverage.run]
source = ["api", "train"]
omit = [
    "tests/*",
    "App/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 0
